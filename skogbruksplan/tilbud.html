<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tilbudsforespørsel – SkogIQ.ai</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg: #e9ede7; --surface: #fbfcfa; --surface-2: #eff3ee; --text: #10241c; --text-2: #43544b; --border: rgba(16,36,28,.14); --accent: #1f6b4a; --accent-hover: #185a3d; --danger: #b4302f; --good: #1f6b4a; --warn: #a05a00; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1a15; --surface: #15241d; --surface-2: #1b2d25; --text: #e6efe9; --text-2: #a9bcb1; --border: rgba(230,239,233,.16); --accent: #3f9b6e; --accent-hover: #4fae80; --danger: #ff8a7a; --good: #6fcf97; --warn: #f2b66b; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 'Schibsted Grotesk', system-ui, -apple-system, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 8px 0 12px; }
  .logo { font-weight: 800; font-size: 20px; } .logo b { color: #c93a55; }
  .kort { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 6px; } h2 { font-size: 17px; margin: 0 0 10px; }
  .hint { color: var(--text-2); font-size: 14px; }
  .frist { display: inline-block; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); font-weight: 700; font-size: 14px; }
  .frist.ute { color: var(--danger); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; } dt { color: var(--text-2); } dd { margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; } th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); } th { color: var(--text-2); font-weight: 600; } td.t, th.t { text-align: right; font-variant-numeric: tabular-nums; }
  .tabell { overflow-x: auto; }
  svg.kart { width: 100%; height: auto; border-radius: 12px; background: var(--surface-2); }
  svg.kart path { fill: rgba(243,156,74,.55); stroke: #b5651d; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  svg.kart text { font: 700 12px system-ui, sans-serif; fill: var(--text); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
  form { display: grid; gap: 12px; }
  .to { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 600px) { .to { grid-template-columns: 1fr; } }
  label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
  input, textarea, select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); width: 100%; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .krav label { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
  .krav input { width: auto; margin-top: 4px; }
  .sum { font-size: 20px; font-weight: 800; }
  button { font: 700 16px/1 inherit; font-family: inherit; padding: 14px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer; }
  button:hover { background: var(--accent-hover); } button:disabled { opacity: .6; cursor: progress; }
  .melding { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-weight: 600; }
  .melding.ok { border-left: 4px solid var(--good); } .melding.feil { border-left: 4px solid var(--danger); } .melding.info { border-left: 4px solid var(--warn); }
  pre { white-space: pre-wrap; font: inherit; margin: 0; }
  footer { text-align: center; color: var(--text-2); font-size: 12px; padding: 12px 0 28px; }
</style>
</head>
<body>
<main>
  <header><span class="logo">Skog<b>IQ</b>.ai</span><span class="hint">Tilbudsforespørsel</span></header>
  <div id="innhold"><div class="kort">Henter forespørselen …</div></div>
  <footer>Forespørselen er sendt fra SkogIQ.ai · Utviklet av Trond Harald Sand</footer>
</main>
<script type="module" src="js/tilbud-svar.js"></script>
</body>
</html>
