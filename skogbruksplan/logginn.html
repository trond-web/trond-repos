<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Trond Harald Sand">
<meta name="robots" content="noindex">
<title>Logg inn – SkogIQ.ai</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg: #e9ede7; --surface: #fbfcfa; --surface-2: #eff3ee; --text: #10241c; --text-2: #43544b; --border: rgba(16,36,28,.16); --accent: #1f6b4a; --accent-hover: #185a3d; --danger: #b4302f; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1a15; --surface: #15241d; --surface-2: #1b2d25; --text: #e6efe9; --text-2: #a9bcb1; --border: rgba(230,239,233,.16); --accent: #3f9b6e; --accent-hover: #4fae80; --danger: #ff8a7a; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.45 'Schibsted Grotesk', system-ui, -apple-system, sans-serif; }
  main { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.12); }
  .logo { font-size: 26px; font-weight: 800; letter-spacing: -.3px; margin: 0 0 2px; } .logo b { color: #c93a55; }
  p { margin: 0 0 16px; color: var(--text-2); font-size: 14px; }
  .faner { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin: 10px 0 18px; }
  .faner button { margin: 0; background: transparent; color: var(--text-2); font-size: 14px; padding: 9px; }
  .faner button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .faner button:hover { background: var(--surface); }
  label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  label small { font-weight: 400; color: var(--text-2); }
  input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); width: 100%; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { width: 100%; font: 700 16px/1 inherit; font-family: inherit; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; margin-top: 4px; }
  button:hover { background: var(--accent-hover); } button:disabled { opacity: .6; cursor: progress; }
  .feil { color: var(--danger); font-size: 14px; min-height: 20px; margin: 10px 0 0; }
  footer { margin-top: 18px; font-size: 12px; color: var(--text-2); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 class="logo">Skog<b>IQ</b>.ai</h1>
  <div class="faner" role="tablist" id="faner" hidden>
    <button type="button" role="tab" aria-selected="true" data-fane="inn">Logg inn</button>
    <button type="button" role="tab" aria-selected="false" data-fane="reg">Registrer deg</button>
  </div>
  <!-- Innlogging: autocomplete gjør at nettleseren kan huske brukernavn og passord -->
  <form id="inn" autocomplete="on">
    <p id="innTekst">Logg inn for å bruke skogbruksplanen.</p>
    <label>Brukernavn <input name="bruker" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Passord <input name="passord" type="password" autocomplete="current-password" required></label>
    <button type="submit">Logg inn</button>
    <div class="feil" role="alert"></div>
  </form>
  <form id="reg" autocomplete="on" hidden>
    <p>Lag en bruker for å ta i bruk SkogIQ.ai. Nettleseren kan huske brukernavn og passord for deg.</p>
    <label>Navn <input name="navn" autocomplete="name" maxlength="80" required></label>
    <label>E-post <small>(valgfri – for å få hjelp med brukeren)</small><input name="epost" type="email" autocomplete="email" maxlength="120"></label>
    <label>Brukernavn <small>3–32 tegn: a–z, tall, . - _</small><input name="bruker" autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[a-zA-Z0-9][a-zA-Z0-9._-]{2,31}" required></label>
    <label>Passord <small>minst 8 tegn</small><input name="passord" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Gjenta passordet <input name="passord2" type="password" autocomplete="new-password" minlength="8" required></label>
    <label id="kodeFelt" hidden>Registreringskode <small>fra administrator</small><input name="kode" autocomplete="off"></label>
    <button type="submit">Registrer og logg inn</button>
    <div class="feil" role="alert"></div>
  </form>
  <footer>Utviklet av Trond Harald Sand</footer>
</main>
<script type="module">
  import { RAILWAY, LS_OKT } from './js/innlogging.js';
  const API = /github\.io$/.test(location.hostname) ? RAILWAY : '';
  // Bare adresser i appen selv (ingen videresending til andre nettsteder).
  // «?full» og «#…» gjelder appen i samme mappe (./), ikke innloggingssiden.
  const neste = (() => { const n = new URLSearchParams(location.search).get('neste') || ''; if (!/^(\/(?!\/)|(\.\/)?[\w.-]*([?#].*)?$)/.test(n) || /^[a-z]+:/i.test(n)) return './'; return /^[?#]/.test(n) ? `./${n}` : n || './'; })();
  const inn = document.getElementById('inn'); const reg = document.getElementById('reg'); const faner = document.getElementById('faner');
  const visFane = (f) => { inn.hidden = f !== 'inn'; reg.hidden = f !== 'reg'; for (const b of faner.querySelectorAll('button')) b.setAttribute('aria-selected', String(b.dataset.fane === f)); (f === 'inn' ? inn.bruker : reg.navn).focus(); };
  faner.addEventListener('click', (e) => { const b = e.target.closest('[data-fane]'); if (b) visFane(b.dataset.fane); });
  inn.bruker.focus();
  // Er registrering slått på? (og kreves kode?)
  fetch(`${API}/api/meg`, { credentials: 'same-origin', cache: 'no-store' }).then((r) => r.json()).then((d) => {
    if (d.registrering) { faner.hidden = false; document.getElementById('innTekst').textContent = 'Logg inn, eller registrer deg hvis du er ny.'; if (location.hash === '#registrer') visFane('reg'); }
    if (d.kodeKreves) document.getElementById('kodeFelt').hidden = false;
  }).catch(() => {});
  async function send(skjema, sti, kropp) {
    const feil = skjema.querySelector('.feil'); feil.textContent = ''; const knapp = skjema.querySelector('button[type=submit]'); knapp.disabled = true;
    try {
      const r = await fetch(`${API}${sti}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(kropp) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { feil.textContent = d.feil || `Serveren svarte ${r.status}`; return; }
      try { if (d.token) localStorage.setItem(LS_OKT, d.token); localStorage.setItem('skogiq-innlogget-for', '1'); } catch { /* privat modus */ }
      // Be nettleseren huske brukernavn og passord (der det støttes)
      try { if (window.PasswordCredential) await navigator.credentials.store(new PasswordCredential({ id: kropp.bruker, password: kropp.passord, name: kropp.navn || kropp.bruker })); } catch { /* ikke støttet */ }
      location.replace(neste || './');
    } catch { feil.textContent = 'Ingen kontakt med SkogIQ-serveren. Sjekk nettet.'; } finally { knapp.disabled = false; }
  }
  inn.addEventListener('submit', (e) => { e.preventDefault(); send(inn, '/api/logginn', { bruker: inn.bruker.value.trim(), passord: inn.passord.value }); });
  reg.addEventListener('submit', (e) => {
    e.preventDefault();
    if (reg.passord.value !== reg.passord2.value) { reg.querySelector('.feil').textContent = 'Passordene er ikke like'; return; }
    send(reg, '/api/registrer', { navn: reg.navn.value.trim(), epost: reg.epost.value.trim(), bruker: reg.bruker.value.trim().toLowerCase(), passord: reg.passord.value, kode: reg.kode.value.trim() });
  });
</script>
</body>
</html>
