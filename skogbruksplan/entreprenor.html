<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="author" content="Trond Harald Sand">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>SkogIQ Entreprenør</title>
<meta name="description" content="SkogIQ Entreprenør – feltløsning for entreprenører: oppdrag fra skogeiere, kart med hensyn, framdrift, miljøsjekk, avvik med bilde og sluttrapport med signatur. Fungerer offline.">
<meta name="theme-color" content="#10241c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SkogIQ Entreprenør">
<link rel="manifest" href="entreprenor.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="felt.css">
<link rel="stylesheet" href="entreprenor.css">
<script type="module">import { startSprak, kobleSprakKnapper } from './js/sprak.js'; startSprak(); if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => kobleSprakKnapper()); else kobleSprakKnapper();</script>
</head>
<body class="ent">
<div id="kart" aria-label="Kart"></div>

<header class="topp">
  <button type="button" class="planvelger" id="oppdragVelger" aria-haspopup="dialog">
    <span class="logo">Skog<b>IQ</b> <small class="ent-merke">Entreprenør</small></span>
    <span class="plannavn" id="oppdragNavn">Mine oppdrag</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
  </button>
  <span class="nett" id="nett" title="Nettstatus"></span>
</header>

<div class="kartknapper">
  <button type="button" class="rund" id="lagBtn" title="Bytt kartlag" aria-label="Bytt kartlag"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button type="button" class="rund" id="zoomBtn" title="Vis oppdraget" aria-label="Vis oppdraget"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button type="button" class="rund" id="gpsBtn" title="Min posisjon" aria-label="Min posisjon" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
</div>

<div class="ent-synk" id="synkStripe" hidden></div>

<button type="button" class="fab" id="avvikBtn" aria-label="Registrer avvik" hidden><svg viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4M12 17.2v.1"/></svg><span>Avvik</span></button>

<section class="ark" id="ark" hidden aria-live="polite">
  <div class="ark-handtak" id="arkHandtak"><span></span></div>
  <button type="button" class="ark-lukk" id="arkLukk" aria-label="Lukk">✕</button>
  <div class="ark-innhold" id="arkInnhold"></div>
</section>

<nav class="bunn" aria-label="Meny">
  <button type="button" data-vis="oppdrag" class="aktiv"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8.5 12l2 2 4-4M8.5 17h7"/></svg><span>Oppdrag</span></button>
  <button type="button" data-vis="bestand"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11"/><circle cx="5" cy="18" r="1.3"/></svg><span>Framdrift</span></button>
  <button type="button" data-vis="miljo"><svg viewBox="0 0 24 24"><path d="M12 21c-4-3-7-6.5-7-10.5C5 6 8 3 12 3s7 3 7 7.5c0 4-3 7.5-7 10.5Z"/><path d="M12 8v8M9 12.5l3 3 3-3"/></svg><span>Miljø</span></button>
  <button type="button" data-vis="avvik"><svg viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4M12 17.2v.1"/></svg><span>Avvik</span></button>
  <button type="button" data-vis="ferdig"><svg viewBox="0 0 24 24"><path d="M4 17c2-1 3-5 5-5s2 4 4 4 3-6 7-8"/><path d="M4 21h16"/></svg><span>Ferdig</span></button>
</nav>

<div class="melding" id="melding" role="status" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="js/entreprenor-app.js"></script>
</body>
</html>
