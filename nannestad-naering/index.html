<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Næringsmuligheter Nannestad</title>
<meta name="description" content="Kart over næringsmuligheter på eiendommer i Nannestad: arealtyper, kommuneplan, flystøy, grunnforhold og en rangert, bærekraftig plan for hvordan eiendommen kan utnyttes – med økonomikalkyle.">
<meta name="theme-color" content="#1f4d36">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topp">
  <a class="merke" href="./" aria-label="Næringsmuligheter Nannestad – start">
    <img src="icon.svg" alt="" width="28" height="28">
    <span>Næringsmuligheter <em>Nannestad</em></span>
  </a>
  <form id="sok" class="sok" role="search" autocomplete="off">
    <label class="skjult" for="sokefelt">Adresse eller gårds- og bruksnummer</label>
    <input id="sokefelt" type="search" placeholder="Adresse eller gnr/bnr, f.eks. 29/2" enterkeyhint="search">
    <button type="submit">Analyser</button>
    <ul id="forslag" class="forslag" role="listbox" hidden></ul>
  </form>
  <button id="skriv" class="knapp-lys" type="button">Skriv ut</button>
</header>

<main class="flate">
  <section class="kartkolonne">
    <div id="kart" aria-label="Kart"></div>
    <div id="tegnforklaring" class="tegnforklaring" aria-label="Tegnforklaring"></div>
    <p class="karttips">Klikk på en eiendom i kartet for å analysere den. Velg kartlag oppe til høyre i kartet.</p>
  </section>

  <section class="panel">
    <nav class="faner" role="tablist">
      <button role="tab" data-fane="oversikt" aria-selected="true">Eiendommen</button>
      <button role="tab" data-fane="muligheter" aria-selected="false">Muligheter</button>
      <button role="tab" data-fane="okonomi" aria-selected="false">Økonomi</button>
      <button role="tab" data-fane="kommunen" aria-selected="false">Nannestad</button>
      <button role="tab" data-fane="kilder" aria-selected="false">Om</button>
    </nav>
    <div id="framdrift" class="framdrift" hidden></div>
    <div id="feil" class="feilboks" hidden></div>
    <div id="fane-oversikt" class="fane" role="tabpanel"></div>
    <div id="fane-muligheter" class="fane" role="tabpanel" hidden></div>
    <div id="fane-okonomi" class="fane" role="tabpanel" hidden></div>
    <div id="fane-kommunen" class="fane" role="tabpanel" hidden></div>
    <div id="fane-kilder" class="fane" role="tabpanel" hidden></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
