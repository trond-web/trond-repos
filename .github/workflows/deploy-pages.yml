name: Deploy GitHub Pages (tretetthet-flyfoto + skogbruksplan)

on:
  push:
    branches: [main]
    paths:
      - "tretetthet-flyfoto/**"
      - "skogbruksplan/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tretetthet-flyfoto beholder rot-URL-en; skogbruksplan publiseres under /skogbruksplan/
      - name: Build site
        run: |
          mkdir -p _site
          cp -r tretetthet-flyfoto/. _site/
          mkdir -p _site/skogbruksplan
          cp -r skogbruksplan/. _site/skogbruksplan/
          rm -rf _site/skogbruksplan/tests _site/skogbruksplan/server.js _site/skogbruksplan/package.json _site/skogbruksplan/railway.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
