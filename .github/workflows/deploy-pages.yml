name: Deploy apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "tretetthet-flyfoto/**"
      - "snovill-skifore/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tretetthet-flyfoto ligger fortsatt på rot-URL-en, øvrige apper under egne stier
      - name: Assemble site
        run: |
          mkdir -p _site/snovill-skifore
          cp -r tretetthet-flyfoto/. _site/
          cp -r snovill-skifore/. _site/snovill-skifore/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
