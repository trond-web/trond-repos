name: Deploy apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "tretetthet-flyfoto/**"
      - "snovill-skifore/**"
      - "therese-helge/**"
      - "skogbruksplan/**"
      - "sefrak-eiendom/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tretetthet-flyfoto ligger fortsatt på rot-URL-en, øvrige apper under egne stier
      - name: Assemble site
        run: |
          mkdir -p _site/snovill-skifore _site/therese-helge _site/skogbruksplan _site/sefrak-eiendom
          cp -r tretetthet-flyfoto/. _site/
          cp -r snovill-skifore/. _site/snovill-skifore/
          cp -r therese-helge/. _site/therese-helge/
          cp -r skogbruksplan/. _site/skogbruksplan/
          cp -r sefrak-eiendom/. _site/sefrak-eiendom/
          # Tester, verktøy og serverfiler (Railway) publiseres ikke på GitHub Pages
          rm -rf _site/skogbruksplan/tests _site/skogbruksplan/verktoy _site/skogbruksplan/server.js _site/skogbruksplan/package.json _site/skogbruksplan/railway.json _site/sefrak-eiendom/tests

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
