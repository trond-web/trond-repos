name: Deploy apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "tretetthet-flyfoto/**"
      - "snovill-skifore/**"
      - "therese-helge/**"
      - "skogbruksplan/**"
      - "sefrak-eiendom/**"
      - "borsradar/**"
      - "team-sjusjoen/**"
      - "nordfjella-villrein/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # Børsradar: ny analyse hver handelsdag etter børsslutt (18:45 norsk sommertid / 17:45 vintertid)
    - cron: "45 16 * * 1-5"
    # Snøvill: ferske snødata fra NVE/seNorge morgen og kveld, utenfor børsens åpningstid
    - cron: "17 5,19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Henter ferske kurser og regner ut signaler. Feiler det, publiseres siste analyse fra repoet.
      - name: Børsradar-analyse
        continue-on-error: true
        timeout-minutes: 10
        run: node borsradar/analyse/analyser.mjs

      # tretetthet-flyfoto ligger fortsatt på rot-URL-en, øvrige apper under egne stier
      - name: Assemble site
        run: |
          mkdir -p _site/snovill-skifore _site/therese-helge _site/skogbruksplan _site/sefrak-eiendom _site/borsradar _site/team-sjusjoen _site/nordfjella-villrein
          cp -r tretetthet-flyfoto/. _site/
          cp -r snovill-skifore/. _site/snovill-skifore/
          cp -r therese-helge/. _site/therese-helge/
          cp -r skogbruksplan/. _site/skogbruksplan/
          cp -r sefrak-eiendom/. _site/sefrak-eiendom/
          cp -r borsradar/. _site/borsradar/
          cp -r team-sjusjoen/. _site/team-sjusjoen/
          # Nordfjella villrein kjører på Railway (med server). Pages sender videre dit og rydder bort den gamle appen.
          cp nordfjella-villrein/pages-videresending/* _site/nordfjella-villrein/
          rm -f _site/team-sjusjoen/bilder/README.md
          # Tester, verktøy og serverfiler (Railway) publiseres ikke på GitHub Pages
          rm -rf _site/skogbruksplan/tests _site/skogbruksplan/verktoy _site/skogbruksplan/server.js _site/skogbruksplan/package.json _site/skogbruksplan/railway.json _site/sefrak-eiendom/tests _site/borsradar/analyse _site/borsradar/data/innsidehandel.json

      # Snøvill: snødybde, snømengde og smelting fra NVE/seNorge legges ved som datafil
      - name: Snødata fra NVE (Snøvill)
        continue-on-error: true
        timeout-minutes: 5
        run: node snovill-skifore/data/hent-nve.mjs _site/snovill-skifore/data/nve-sno.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
