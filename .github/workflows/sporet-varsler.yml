name: Snøvill løypevarsler

on:
  schedule:
    # Hvert 10. minutt (GitHub kan forsinke planlagte kjøringer noe)
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_varsel:
        description: "Send et testvarsel til ntfy"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sporet-varsler
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: snovill-skifore

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # «Sist sett» per løype tas vare på mellom kjøringene i Actions-cachen
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .sporet-state
          key: sporet-state-${{ github.run_id }}
          restore-keys: sporet-state-

      - name: Sjekk Sporet og send varsler
        run: node snovill-skifore/varsler/sjekk-sporet.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          TEST_VARSEL: ${{ inputs.test_varsel }}

      - name: Save state
        if: always() && hashFiles('.sporet-state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .sporet-state
          key: sporet-state-${{ github.run_id }}
